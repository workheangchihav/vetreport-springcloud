spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: auth-server
          uri: ${AUTH_SERVER_URL:http://demo-auth-server:8081}
          filters:
            - PreserveHostHeader
          predicates:
            - Path=/api/auth/**,/api/users/**,/api/rbac/**,/api/services/**
        - id: call-service
          uri: ${CALL_SERVICE_URL:http://demo-call-service:8082}
          filters:
            - PreserveHostHeader
          predicates:
            - Path=/api/calls/**
        - id: delivery-service
          uri: ${DELIVERY_SERVICE_URL:http://demo-delivery-service:8083}
          filters:
            - PreserveHostHeader
          predicates:
            - Path=/api/deliveries/**
        - id: marketing-service
          uri: ${MARKETING_SERVICE_URL:http://demo-marketing-service:8084}
          filters:
            - PreserveHostHeader
          predicates:
            - Path=/api/marketing/**
        - id: branchreport-service
          uri: ${BRANCHREPORT_SERVICE_URL:http://demo-branchreport-service:8085}
          filters:
            - PreserveHostHeader
          predicates:
            - Path=/api/branchreport/**
        - id: region-service
          uri: ${REGION_SERVICE_URL:http://demo-region-service:8086}
          filters:
            - PreserveHostHeader
          predicates:
            - Path=/api/region/**
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: ${GATEWAY_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,https://vetapi.khmersoftware.com,https://dev.khmersoftware.com,https://vetreport.vercel.app,exp://*,*}
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

# JWT Configuration - Standard Spring Security approach
# Uses JWT_SECRET from .env file (standard practice)
security:
  jwt:
    secret: ${JWT_SECRET}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus,gateway

logging:
  level:
    '[com.example.gateway]': DEBUG
    '[org.springframework.cloud.gateway]': DEBUG
    '[org.springframework.security]': DEBUG
